<!-- ================== OBFUSCATION WORKER ================== -->
<script id="obfWorker" type="javascript/worker">
const KEYWORDS=new Set(['and','break','do','else','elseif','end','false','for','function','goto','if','in','local','nil','not','or','repeat','return','then','true','until','while']);
const GLOBALS=new Set(['_G','_VERSION','_ENV','assert','collectgarbage','dofile','error','getfenv','getmetatable','ipairs','load','loadfile','loadstring','module','next','pairs','pcall','print','rawequal','rawget','rawset','require','select','setfenv','setmetatable','tonumber','tostring','type','unpack','xpcall','coroutine','debug','io','math','os','package','string','table','bit32','utf8','arg','self','game','workspace','script','Instance','Enum','UDim2','UDim','Color3','Vector2','Vector3','CFrame','task','wait','spawn','delay','warn','tick','time','Game','Shared','settings','UserSettings','version','PluginManager','DateTime']);

function matchLongBracket(src,i){if(src[i]!=='[')return -1;let j=i+1;while(src[j]==='=')j++;if(src[j]!=='[')return -1;return j-i-1;}
function findLongBracketEnd(src,i,level){const close=']'+'='.repeat(level)+']';const idx=src.indexOf(close,i+level+2);return idx===-1?src.length-1:idx+close.length-1;}

function tokenize(src){
  const tokens=[];const n=src.length;let i=0;
  while(i<n){
    const c=src[i];
    if(/\s/.test(c)){let j=i;while(j<n&&/\s/.test(src[j]))j++;tokens.push({type:'ws',value:src.slice(i,j)});i=j;continue;}
    if(c==='-'&&src[i+1]==='-'){
      if(src[i+2]==='['){const lvl=matchLongBracket(src,i+2);if(lvl!==-1){const end=findLongBracketEnd(src,i+2,lvl);tokens.push({type:'comment',value:src.slice(i,end+1)});i=end+1;continue;}}
      let j=i;while(j<n&&src[j]!=='\n')j++;tokens.push({type:'comment',value:src.slice(i,j)});i=j;continue;
    }
    if(c==='['){const lvl=matchLongBracket(src,i);if(lvl!==-1){const end=findLongBracketEnd(src,i,lvl);tokens.push({type:'string',value:src.slice(i,end+1)});i=end+1;continue;}}
    if(c==='"'||c==="'"){
      let j=i+1;while(j<n){if(src[j]==='\\'){j+=2;continue;}if(src[j]===c){j++;break;}if(src[j]==='\n')break;j++;}
      tokens.push({type:'string',value:src.slice(i,j)});i=j;continue;
    }
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(src[i+1]||''))){
      let j=i;
      if(c==='0'&&(src[i+1]==='x'||src[i+1]==='X')){
        j=i+2;while(j<n&&/[0-9a-fA-F.]/.test(src[j]))j++;
        if(src[j]==='p'||src[j]==='P'){j++;if(src[j]==='+'||src[j]==='-')j++;while(j<n&&/[0-9]/.test(src[j]))j++;}
      }else{
        while(j<n&&/[0-9]/.test(src[j]))j++;
        if(src[j]==='.'){j++;while(j<n&&/[0-9]/.test(src[j]))j++;}
        if(src[j]==='e'||src[j]==='E'){j++;if(src[j]==='+'||src[j]==='-')j++;while(j<n&&/[0-9]/.test(src[j]))j++;}
      }
      tokens.push({type:'number',value:src.slice(i,j)});i=j;continue;
    }
    if(/[A-Za-z_]/.test(c)){
      let j=i;while(j<n&&/[A-Za-z0-9_]/.test(src[j]))j++;
      const v=src.slice(i,j);tokens.push({type:KEYWORDS.has(v)?'keyword':'name',value:v});i=j;continue;
    }
    const three=src.substr(i,3);
    if(three==='...'){tokens.push({type:'op',value:'...'});i+=3;continue;}
    const two=src.substr(i,2);
    if(['==','~=','<=','>=','..','::','//','<<','>>'].includes(two)){tokens.push({type:'op',value:two});i+=2;continue;}
    tokens.push({type:'op',value:c});i++;
  }
  return tokens;
}

function collectLocals(tokens){
  const locals=new Set();
  for(let i=0;i<tokens.length;i++){
    const t=tokens[i];
    if(t.type==='keyword'&&t.value==='local'){
      let j=i+1;
      if(tokens[j]&&tokens[j].type==='keyword'&&tokens[j].value==='function'){
        j++;if(tokens[j]&&tokens[j].type==='name')locals.add(tokens[j].value);
      }else{
        while(j<tokens.length){
          const tk=tokens[j];
          if(tk.type==='name'){locals.add(tk.value);j++;}
          else if(tk.type==='op'&&tk.value===','){j++;}
          else break;
        }
      }
    }
    if(t.type==='keyword'&&t.value==='function'){
      let j=i+1;
      while(j<tokens.length&&tokens[j].value!=='('){if(tokens[j].type==='keyword')break;j++;}
      if(j<tokens.length&&tokens[j].value==='('){
        j++;
        while(j<tokens.length&&tokens[j].value!==')'){
          if(tokens[j].type==='name')locals.add(tokens[j].value);
          j++;
        }
      }
    }
    if(t.type==='keyword'&&t.value==='for'){
      let j=i+1;
      while(j<tokens.length){
        const tk=tokens[j];
        if(tk.type==='name'){locals.add(tk.value);j++;}
        else if(tk.type==='op'&&tk.value===','){j++;}
        else break;
      }
    }
  }
  return locals;
}

function parseLuaString(raw){
  if(raw[0]==='['){
    const level=matchLongBracket(raw,0);
    let inner=raw.slice(level+2,raw.length-level-2);
    if(inner.startsWith('\r\n'))inner=inner.slice(2);
    else if(inner.startsWith('\n'))inner=inner.slice(1);
    return inner;
  }
  const body=raw.slice(1,-1);let out='';
  for(let i=0;i<body.length;i++){
    const c=body[i];
    if(c!=='\\'){out+=c;continue;}
    const nx=body[i+1];
    switch(nx){
      case 'n':out+='\n';i++;break;
      case 't':out+='\t';i++;break;
      case 'r':out+='\r';i++;break;
      case 'a':out+='\x07';i++;break;
      case 'b':out+='\b';i++;break;
      case 'f':out+='\f';i++;break;
      case 'v':out+='\v';i++;break;
      case '\\':out+='\\';i++;break;
      case '"':out+='"';i++;break;
      case "'":out+="'";i++;break;
      case '\n':out+='\n';i++;break;
      case '\r':out+='\n';i++;if(body[i+2]==='\n')i++;break;
      case 'x':{let hex='';let j=i+2;while(j<body.length&&hex.length<2&&/[0-9a-fA-F]/.test(body[j])){hex+=body[j];j++;}out+=String.fromCharCode(parseInt(hex,16)||0);i=j-1;break;}
      case 'z':{i++;while(i+1<body.length&&/\s/.test(body[i+1]))i++;break;}
      default:
        if(nx&&/[0-9]/.test(nx)){let num='';let j=i+1;while(j<body.length&&num.length<3&&/[0-9]/.test(body[j])){num+=body[j];j++;}out+=String.fromCharCode(parseInt(num,10));i=j-1;}
        else if(nx!==undefined){out+=nx;i++;}
    }
  }
  return out;
}

function encodeString(str,dName){
  const key=1+Math.floor(Math.random()*255);
  let escaped='';
  let chk=0;
  let hash=0;
  for(let i=0;i<str.length;i++){
    let byte=str.charCodeAt(i)&0xff;
    chk=(chk+byte)%65536;
    hash=(hash*131+byte)%65536;
    byte=byte^key;
    escaped+='\\'+byte.toString().padStart(3,'0');
  }
  return dName+'("'+escaped+'",'+key+','+chk+','+hash+')';
}
function encodeStringChunked(str,dName){
  if(str.length<3)return encodeString(str,dName);
  const maxParts=Math.min(6,str.length);
  const n=2+Math.floor(Math.random()*Math.min(5,maxParts-1));
  const cuts=[];
  while(cuts.length<n-1){
    const cut=1+Math.floor(Math.random()*(str.length-1));
    if(!cuts.includes(cut))cuts.push(cut);
  }
  cuts.sort((a,b)=>a-b);
  const parts=[];
  let pos=0;
  for(const cut of cuts){
    parts.push(str.slice(pos,cut));
    pos=cut;
  }
  parts.push(str.slice(pos));
  return parts.map(c=>encodeString(c,dName)).join('..');
}

function encodeNumber(numStr,useExpr){
  if(/^\d+$/.test(numStr)){
    const n=parseInt(numStr,10);
    if(useExpr&&n>3){
      const a=1+Math.floor(Math.random()*(n-2));
      const b=n-a;
      const op=Math.random()<0.5?'+':'-';
      if(op==='-')return '('+(n+b)+'-'+b+')';
      return '('+a+'+'+b+')';
    }
    return '(0x'+n.toString(16)+')';
  }
  if(/^0[xX][0-9a-fA-F]+$/.test(numStr))return '('+numStr+')';
  return numStr;
}

function buildHeader(bxName,dName){
  const chk=17^29;
  const hashChk=(17*131+29)%65536;
  return 'local '+bxName+'=bit32 and bit32.bxor or function(a,b)local r,p=0,1 while a>0 or b>0 do local x,y=a%2,b%2 if x~=y then r=r+p end a=(a-x)/2 b=(b-y)/2 p=p*2 end return r end '+
         'local '+dName+'=function(s,k,c,h)local t={}local q=0 local z=0 for i=1,#s do local v='+bxName+'(string.byte(s,i),k) q=(q+v)%65536 z=(z*131+v)%65536 t[i]=string.char(v) end if k<1 or k>255 then error("decoder key integrity failure") end if c~=nil and q~=c then error("string integrity failure") end if h~=nil and z~=h then error("string hash integrity failure") end return table.concat(t)end\n'+
         'do local _n='+bxName+'(17,29) local _h=(17*131+29)%65536 if _n~='+chk+' or _h~='+hashChk+' then error("decoder integrity failure") end end\n';
}
function buildAntiTamper(tamperFlagName){
  const L=[];
  L.push('-- NullFuscator Anti-Tamper');
  L.push('local '+tamperFlagName+'=true');
  L.push('pcall(function()');
  L.push('  if type(pcall)~="function" or type(error)~="function" or type(type)~="function" or type(tostring)~="function" then');
  L.push('    '+tamperFlagName+'=false');
  L.push('  end');
  L.push('  local _sm=getmetatable and getmetatable("")');
  L.push('  if _sm and _sm.__index and type(_sm.__index)~="table" then '+tamperFlagName+'=false end');
  L.push('  if debug and type(debug.getinfo)=="function" then');
  L.push('    local _ok=pcall(function() local _i=debug.getinfo(1,"f") if _i~=nil and type(_i)~="table" then '+tamperFlagName+'=false end end)');
  L.push('    if not _ok then '+tamperFlagName+'=false end');
  L.push('  end');
  L.push('  if debug and type(debug.sethook)=="function" and type(debug.gethook)=="function" then');
  L.push('    local _c=0');
  L.push('    pcall(function()');
  L.push('      debug.sethook(function() _c=_c+1 end,"l")');
  L.push('      _c=_c+1');
  L.push('      local _hk=debug.gethook()');
  L.push('      if _hk==nil then '+tamperFlagName+'=false end');
  L.push('      debug.sethook()');
  L.push('    end)');
  L.push('    if _c<1 then '+tamperFlagName+'=false end');
  L.push('  end');
  L.push('  pcall(function()');
  L.push('    local _s=tostring');
  L.push('    local _v=_s(12345)');
  L.push('    if type(_v)~="string" then '+tamperFlagName+'=false end');
  L.push('  end)');
  L.push('  pcall(function()');
  L.push('    local _ok,_v=pcall(function() return 7*11 end)');
  L.push('    if not _ok or _v~=77 then '+tamperFlagName+'=false end');
  L.push('  end)');
  L.push('end)');
  L.push('if not '+tamperFlagName+' then return end');
  L.push('');
  return L.join('\n');
}

function generateDeadBlock(rng){
  const templates=[
    'do local _a,_b=0,1 for _i=1,math.random(5,20) do _a=_a+_b*_i _b=_b+_a end end',
    'do local _t={} for _i=1,math.random(8,25) do _t[_i]=(_i*7)%13 end end',
    'do local _x=0 while _x<math.random(10,30) do _x=_x+1 if _x%5==0 then _x=_x+1 end end end',
    'do local _s="" for _i=1,math.random(3,8) do _s=_s..string.char(math.random(65,90)) end end',
    'do local _n=os.time()%1000 for _i=1,10 do _n=(_n*31+17)%10007 end end',
    'do local _f=function(a,b)return a~=b end local _r=false for _i=1,math.random(5,15) do _r=_f(_i,_i+1) end end',
    'do local _p={1,2,3,4,5} local _q=0 for _,_v in ipairs(_p) do _q=_q+_v*_v end end',
    'do local _k={} for _i=1,math.random(4,12) do _k[_i]=tostring(_i*_i) end end',
    'do local _u=0 for _i=1,math.random(6,18) do _u=_u+(_i^2)%7 end end',
    'do local _m=1 for _i=1,math.random(4,10) do _m=_m*2 if _m>1e6 then _m=1 end end end',
  ];
  return templates[Math.floor(rng()*templates.length)];
}

function generateOpaqueBlock(rng){
  const a=2+Math.floor(rng()*97);
  const b=2+Math.floor(rng()*97);
  const c=a*b;
  const templates=[
    'if ('+a+'*'+b+'=='+c+') then local _q='+a+'+'+b+' end',
    'if (('+a+'+'+b+')-'+b+'=='+a+') then local _q='+c+'%'+b+' end',
    'if (('+c+'//'+a+')=='+b+') then local _q='+a+'*'+b+' end',
    'if (('+a+'^2-'+a+')%'+(a-1)+'==0) then local _q='+b+' end',
    'if ((('+a+'*'+a+')-'+a+')%'+a+'==0) then local _q='+b+' end',
    'if ((('+b+'+'+a+')-'+a+')=='+b+') then local _q='+c+' end',
    'if (('+c+'%'+a+')==0) then local _q='+b+' end',
    'if (('+a+'*'+b+')%'+a+'==0) then local _q='+c+' end',
  ];
  return templates[Math.floor(rng()*templates.length)];
}

function injectDeadCode(tokens,rng,prob,opaqueProb){
  const result=[];
  let parenDepth=0,bracketDepth=0,braceDepth=0;
  for(let i=0;i<tokens.length;i++){
    const t=tokens[i];
    if(t.type==='op'){
      if(t.value==='(')parenDepth++;
      else if(t.value===')')parenDepth=Math.max(0,parenDepth-1);
      else if(t.value==='[')bracketDepth++;
      else if(t.value===']')bracketDepth=Math.max(0,bracketDepth-1);
      else if(t.value==='{')braceDepth++;
      else if(t.value==='}')braceDepth=Math.max(0,braceDepth-1);
    }
    result.push(t);
    if(t.type==='keyword'&&t.value==='end'){
      const atTop=parenDepth===0&&bracketDepth===0&&braceDepth===0;
      const nx=tokens[i+1];
      const nxOk=!nx||(nx.type==='keyword'&&['local','if','for','while','function','return','do','break','repeat','goto','end'].includes(nx.value))||nx.type==='name';
      if(atTop&&nxOk&&rng()<prob){
        result.push({type:'raw',value:' '+generateDeadBlock(rng)+' '});
        if(opaqueProb>0&&rng()<opaqueProb){
          result.push({type:'raw',value:' '+generateOpaqueBlock(rng)+' '});
        }
      }
    }
  }
  return result;
}

/* ---- NullFuscator V2 VM foundation ---- */
function runVMBytecode(vm,env){
  const stack=[];
  const globals=env||{};
  const callStack=[];
  const frames=[];
  let pc=0;

  while(pc<vm.code.length){
    const ins=vm.code[pc++];

    switch(ins.op){
      case 'PUSHK':
        stack.push(vm.constants[ins.arg]);
        break;

      case 'LOAD':
        stack.push(globals[vm.constants[ins.arg]]);
        break;

      case 'STORE':
        globals[vm.constants[ins.arg]]=stack.pop();
        break;

      case 'JMP':
        pc=ins.arg;
        break;

      case 'JZ':
        if(!stack.pop())pc=ins.arg;
        break;

      case 'JNZ':
        if(stack.pop())pc=ins.arg;
        break;

      case 'CALL': {
        const target=typeof ins.arg==='object'?ins.arg.target:ins.arg;
        const argc=typeof ins.arg==='object'?(ins.arg.args||0):0;
        const args=argc>0?stack.splice(stack.length-argc,argc):[];
        callStack.push(pc);
        frames.push({args});
        pc=target;
        break;
      }

      case 'ARG': {
        const frame=frames[frames.length-1];
        stack.push(frame&&frame.args?frame.args[ins.arg]:undefined);
        break;
      }

      case 'MAKEFUNC':
        stack.push({__vmFunction:true,target:ins.arg});
        break;

      case 'NEWTABLE':
        stack.push({});
        break;

      case 'TABLESET':
        {
          const value=stack.pop();
          const index=ins.arg;
          const obj=stack[stack.length-1];
          if(obj==null)throw new Error('VM TABLESET on nil');
          obj[index]=value;
        }
        break;

      case 'FOR_INIT': {
        const step=ins.step===undefined?1:ins.step;
        const limit=stack.pop();
        const start=stack.pop();
        stack.push({current:start,limit,step});
        break;
      }

      case 'FOR_CHECK': {
        const loop=stack[stack.length-1];
        if(!loop)throw new Error('VM FOR_CHECK without loop state');
        const ok=loop.step>=0?loop.current<=loop.limit:loop.current>=loop.limit;
        stack.push(ok);
        break;
      }

      case 'FOR_STEP': {
        const loop=stack[stack.length-1];
        if(!loop)throw new Error('VM FOR_STEP without loop state');
        loop.current+=loop.step;
        break;
      }

      case 'FOR_VALUE': {
        const loop=stack[stack.length-1];
        if(!loop)throw new Error('VM FOR_VALUE without loop state');
        stack.push(loop.current);
        break;
      }

      case 'FOR_POP':
        stack.pop();
        break;

      case 'BREAK':
        pc=ins.arg;
        break;

      case 'GETTABLE': {
        const key=stack.pop();
        const obj=stack.pop();
        stack.push(obj==null?undefined:obj[key]);
        break;
      }

      case 'SETTABLE': {
        const value=stack.pop();
        const key=stack.pop();
        const obj=stack.pop();
        if(obj==null)throw new Error('VM SETTABLE on nil');
        obj[key]=value;
        stack.push(obj);
        break;
      }

      case 'CALLFUNC': {
        const argc=ins.arg||0;
        const args=argc>0?stack.splice(stack.length-argc,argc):[];
        const fn=stack.pop();

        if(!fn||fn.__vmFunction!==true){
          throw new Error('VM invalid function value');
        }

        callStack.push(pc);
        frames.push({args});
        pc=fn.target;
        break;
      }

      case 'CALLVALUE': {
        const argc=ins.arg||0;
        const args=argc>0?stack.splice(stack.length-argc,argc):[];
        const fn=stack.pop();

        if(typeof fn!=='function'){
          throw new Error('VM invalid value call');
        }

        const result=fn.apply(null,args);

        if(Array.isArray(result)){
          for(let i=0;i<result.length;i++)stack.push(result[i]);
        }else{
          stack.push(result);
        }
        break;
      }

      case 'CALLHOST': {
        const argc=ins.arg||0;
        const args=argc>0?stack.splice(stack.length-argc,argc):[];
        const fn=stack.pop();
        if(typeof fn!=='function'){
          throw new Error('VM invalid host call');
        }
        const result=fn.apply(null,args);
        if(Array.isArray(result)){
          for(let i=0;i<result.length;i++)stack.push(result[i]);
        }else{
          stack.push(result);
        }
        break;
      }

      case 'RETURN': {
        const argc=ins.arg==null?1:ins.arg;
        const values=argc>0?stack.splice(stack.length-argc,argc):[];

        if(!callStack.length){
          if(argc<=1)return values.length?values[0]:undefined;
          return {__vmMultiReturn:true,values};
        }

        pc=callStack.pop();
        frames.pop();

        if(argc<=1){
          if(values.length)stack.push(values[0]);
        }else{
          stack.push({__vmMultiReturn:true,values});
        }

        break;
      }

      case 'TOKEN':
        stack.push(vm.constants[ins.arg]);
        break;

      case 'UNARY': {
        const op=vm.constants[ins.arg];
        const a=stack.pop();

        if(op==='not'){
          stack.push(!a);
        }else if(op==='-'){
          stack.push(-a);
        }else{
          throw new Error('VM unknown unary operator: '+String(op));
        }
        break;
      }

      case 'LOGIC': {
        const op=vm.constants[ins.arg];
        const b=stack.pop();
        const a=stack.pop();

        if(op==='and'){
          stack.push(a && b);
        }else if(op==='or'){
          stack.push(a || b);
        }else{
          throw new Error('VM unknown logic operator: '+String(op));
        }
        break;
      }

      case 'BIN': {
        const b=stack.pop();
        const a=stack.pop();
        const op=vm.constants[ins.arg];
        let r;
        if(op==='+')r=a+b;
        else if(op==='-')r=a-b;
        else if(op==='*')r=a*b;
        else if(op==='/')r=a/b;
        else if(op==='%')r=a%b;
        else if(op==='^')r=a**b;
        else if(op==='..')r=String(a)+String(b);
        else if(op==='==')r=a===b;
        else if(op==='~=')r=a!==b;
        else if(op==='<')r=a<b;
        else if(op==='>')r=a>b;
        else if(op==='<=')r=a<=b;
        else if(op==='>=')r=a>=b;
        else throw new Error('VM invalid binary operator');
        stack.push(r);
        break;
      }

      case 'POP':
        stack.pop();
        break;

      case 'HALT':
        return stack.length?stack[stack.length-1]:undefined;

      default:
        throw new Error('VM unknown opcode: '+String(ins.op));
    }
  }

  return stack.length?stack[stack.length-1]:undefined;
}

function luaVMQuote(value){
  if(value===null)return 'nil';
  if(value===true)return 'true';
  if(value===false)return 'false';

  if(typeof value==='number'){
    if(!Number.isFinite(value))return '0';
    return String(value);
  }

  if(typeof value==='string'){
    let out='"';

    for(let i=0;i<value.length;i++){
      const c=value.charCodeAt(i);

      if(c===92){
        out+='\\\\';
      }else if(c===34){
        out+='\\"';
      }else if(c===13){
        out+='\\r';
      }else if(c===10){
        out+='\\n';
      }else if(c===9){
        out+='\\t';
      }else if(c===0){
        out+='\\0';
      }else if(c<32||c>126){
        out+='\\'+String(c).padStart(3,'0');
      }else{
        out+=value[i];
      }
    }

    return out+'"';
  }

  if(typeof value==='undefined')return 'nil';
  return 'nil';
}

function serializeVMForLua(vm){
  const constants=(vm.constants||[]).map(luaVMQuote).join(',');
  const code=(vm.code||[]).map(function(ins){
    const op=luaVMQuote(ins.op);
    const arg=ins.arg===undefined?'nil':luaVMQuote(ins.arg);
    return '{op='+op+',arg='+arg+'}';
  }).join(',');

  return '{version='+(Number(vm.version)||1)+
         ',constants={'+constants+'},code={'+code+'}}';
}

function buildVMBytecode(tokens){
  const code=[];
  const constants=[];
  const constMap=new Map();

  function constant(value){
    const key=typeof value+':'+String(value);
    if(constMap.has(key))return constMap.get(key);
    const id=constants.length;
    constants.push(value);
    constMap.set(key,id);
    return id;
  }

  function significant(i){
    while(i<tokens.length&&(tokens[i].type==='ws'||tokens[i].type==='comment'))i++;
    return i;
  }

  let i=0;

  while(i<tokens.length){
    i=significant(i);
    if(i>=tokens.length)break;

    const t=tokens[i];
    if(t.type==='op'&&t.value===';'){
      i++;
      continue;
    }


    if(t.type==='keyword'&&t.value==='return'){
      const start=significant(i+1);

      if(start>=tokens.length){
        code.push({op:'RETURN',arg:0});
        i=start;
        continue;
      }

      let end=start;
      let depth=0;

      while(end<tokens.length){
        const x=tokens[end];

        if(x.type==='op'){
          if(x.value==='('||x.value==='['||x.value==='{')depth++;
          else if(x.value===')'||x.value===']'||x.value==='}')depth--;
        }

        if(depth===0&&x.type==='keyword'&&
          (x.value==='local'||x.value==='if'||x.value==='then'||
           x.value==='end'||x.value==='return')){
          break;
        }

        if(depth===0&&x.type==='ws'&&x.value.includes('\n'))break;

        if(depth===0&&x.type==='op'&&x.value===';')break;

        end++;
      }

      code.push(...compileVMExpression(tokens,start,end,constant));
      code.push({op:'RETURN',arg:1});
      i=end;
      continue;
    }

    if(t.type==='keyword'&&t.value==='local'){
      let j=significant(i+1);

      if(j<tokens.length&&tokens[j].type==='name'){
        const name=tokens[j].value;
        const eq=significant(j+1);

        if(eq<tokens.length&&tokens[eq].type==='op'&&tokens[eq].value==='='){
          let k=significant(eq+1);
          let depth=0;
          let end=k;

          while(end<tokens.length){
            const x=tokens[end];

            if(x.type==='op'){
              if(x.value==='(')depth++;
              else if(x.value===')')depth--;
            }

            if(depth===0&&x.type==='keyword'&&
               (x.value==='local'||x.value==='if'||x.value==='then'||
                x.value==='end'||x.value==='return')){
              break;
            }

            if(depth===0&&x.type==='ws'&&x.value.includes('\n'))break;

            if(depth===0&&x.type==='op'&&x.value===';')break;
            end++;
          }

          code.push(...compileVMExpression(tokens,k,end,constant));
          code.push({op:'STORE',arg:constant(name)});
          i=end;
          continue;
        }
      }

      code.push({op:'TOKEN',arg:constant(t.value)});
      i++;
      continue;
    }

    if(t.type==='name'){
      const next=significant(i+1);

            if(next<tokens.length&&tokens[next].type==='op'&&tokens[next].value==='('){
        let depth=1;
        let close=next+1;

        while(close<tokens.length&&depth>0){
          if(tokens[close].type==='op'){
            if(tokens[close].value==='(')depth++;
            else if(tokens[close].value===')')depth--;
          }
          close++;
        }

        if(depth!==0)throw new Error('VM: unterminated function call');

        code.push({op:'LOAD',arg:constant(t.value)});

        let argStart=next+1;
        let argDepth=0;
        let argCount=0;

        for(let a=next+1;a<close-1;a++){
          const x=tokens[a];

          if(x.type==='op'){
            if(x.value==='('||x.value==='['||x.value==='{')argDepth++;
            else if(x.value===')'||x.value===']'||x.value==='}')argDepth--;
          }

          if(argDepth===0&&x.type==='op'&&x.value===','){
            if(a>argStart){
              code.push(...compileVMExpression(tokens,argStart,a,constant));
              argCount++;
            }
            argStart=a+1;
          }
        }

        if(argStart<close-1){
          code.push(...compileVMExpression(tokens,argStart,close-1,constant));
          argCount++;
        }

        code.push({op:'CALLVALUE',arg:argCount});
        i=close;
        continue;
      }

      if(next<tokens.length&&tokens[next].type==='op'&&tokens[next].value==='='){
        let k=significant(next+1);
        let depth=0;
        let end=k;

        while(end<tokens.length){
          const x=tokens[end];

          if(x.type==='op'){
            if(x.value==='(')depth++;
            else if(x.value===')')depth--;
          }

          if(depth===0&&x.type==='keyword'&&
             (x.value==='local'||x.value==='if'||x.value==='then'||
              x.value==='end'||x.value==='return')){
            break;
          }

          if(depth===0&&x.type==='name'){
              let q=significant(end+1);
              if(q<tokens.length&&tokens[q].type==='op'&&(tokens[q].value==='='||tokens[q].value==='(')){
                break;
              }
            }

            if(depth===0&&x.type==='op'&&x.value===';')break;
          end++;
        }

        code.push(...compileVMExpression(tokens,k,end,constant));
        code.push({op:'STORE',arg:constant(t.value)});
        i=end;
        continue;
      }
    }

    if(t.type==='string'){
      code.push({op:'PUSHK',arg:constant(parseLuaString(t.value))});
    }else if(t.type==='number'){
      code.push({op:'PUSHK',arg:constant(t.value)});
    }else if(t.type==='keyword'&&t.value==='true'){
      code.push({op:'PUSHK',arg:constant(true)});
    }else if(t.type==='keyword'&&t.value==='false'){
      code.push({op:'PUSHK',arg:constant(false)});
    }else if(t.type==='keyword'&&t.value==='nil'){
      code.push({op:'PUSHK',arg:constant(null)});
    }else{
      code.push({op:'TOKEN',arg:constant(t.value)});
    }

    i++;
  }

  code.push({op:'HALT'});
  return {version:1,constants,code};
}

function compileVMExpression(tokens,start,end,constant){
  const output=[];
  const ops=[];

  const precedence={
    'or':1,
    'and':2,
    '==':3,
    '~=':3,
    '<':3,
    '>':3,
    '<=':3,
    '>=':3,
    '..':4,
    '+':5,
    '-':5,
    '*':6,
    '/':6,
    '%':6,
    '^':7
  };

  const rightAssociative={
    '^':true
  };

  const emitOp=op=>{
    if(op==='and'||op==='or'){
      output.push({op:'LOGIC',arg:constant(op)});
    }else if(op==='u-'||op==='unot'){
      output.push({op:'UNARY',arg:constant(op==='u-'?'-':'not')});
    }else{
      output.push({op:'BIN',arg:constant(op)});
    }
  };

  function compileValue(a,b){
    const valueTokens=tokens.slice(a,b);
    if(!valueTokens.length)return [];

    const result=compileVMExpression(valueTokens,0,valueTokens.length,constant);
    return result;
  }

  let i=start;

  while(i<end){
    while(i<end&&(tokens[i].type==='ws'||tokens[i].type==='comment'))i++;
    if(i>=end)break;

    const t=tokens[i];

    if(t.type==='keyword'&&t.value==='function'){
      let j=i+1;
      while(j<end&&(tokens[j].type==='ws'||tokens[j].type==='comment'))j++;

      if(j>=end||tokens[j].type!=='op'||tokens[j].value!=='('){
        output.push({op:'TOKEN',arg:constant(t.value)});
        i++;
        continue;
      }

      const params=[];
      j++;

      while(j<end){
        while(j<end&&(tokens[j].type==='ws'||tokens[j].type==='comment'))j++;

        if(j<end&&tokens[j].type==='op'&&tokens[j].value===')'){
          j++;
          break;
        }

        if(j<end&&tokens[j].type==='name'){
          params.push(tokens[j].value);
          j++;

          while(j<end&&(tokens[j].type==='ws'||tokens[j].type==='comment'))j++;

          if(j<end&&tokens[j].type==='op'&&tokens[j].value===','){
            j++;
            continue;
          }
        }else{
          j++;
        }
      }

      const bodyStart=j;
      let bodyEnd=-1;
      let depth=0;

      for(let k=bodyStart;k<end;k++){
        const x=tokens[k];

        if(x.type==='keyword'){
          if(x.value==='function'||
             x.value==='if'||
             x.value==='for'||
             x.value==='while'||
             x.value==='repeat'||
             x.value==='do'){
            depth++;
            continue;
          }

          if(x.value==='end'){
            if(depth===0){
              bodyEnd=k;
              break;
            }
            depth--;
          }
        }
      }

      if(bodyEnd<0){
        output.push({op:'TOKEN',arg:constant(t.value)});
        i++;
        continue;
      }

      const uid='vm_fn_'+start+'_'+i+'_'+bodyEnd;
      const bodyLabel=uid+'_body';
      const endLabel=uid+'_end';

      output.push({op:'MAKEFUNC',arg:bodyLabel});
      output.push({op:'JMP',arg:endLabel});
      output.push(vmLabel(bodyLabel));

      for(let n=0;n<params.length;n++){
        output.push({op:'ARG',arg:n});
        output.push({op:'STORE',arg:constant(params[n])});
      }

      let k=bodyStart;

      while(k<bodyEnd){
        while(k<bodyEnd&&(tokens[k].type==='ws'||tokens[k].type==='comment'))k++;
        if(k>=bodyEnd)break;

        if(tokens[k].type==='keyword'&&tokens[k].value==='if'){
          let q=k+1;
          let depth=0;
          let ifEnd=-1;

          while(q<bodyEnd){
            const x=tokens[q];

            if(x.type==='keyword'){
              if(x.value==='if'||
                 x.value==='for'||
                 x.value==='while'||
                 x.value==='repeat'||
                 x.value==='do'){
                depth++;
              }else if(x.value==='end'){
                if(depth===0){
                  ifEnd=q;
                  break;
                }
                depth--;
              }
            }

            q++;
          }

          if(ifEnd<0){
            throw new Error(
              'VM invalid if block | k='+k+
              ' bodyEnd='+bodyEnd+
              ' scan='+tokens.slice(k,bodyEnd).map(function(t){
                return t.type+':'+t.value;
              }).join('|')
            );
          }

          const ifCode=compileVMIf(
            tokens,
            k,
            ifEnd+1,
            constant
          );

          for(const ins of ifCode)output.push(ins);

          k=ifEnd+1;
          continue;
        }

        if(tokens[k].type==='keyword'&&tokens[k].value==='return'){
          let r=k+1;

          while(r<bodyEnd&&(tokens[r].type==='ws'||tokens[r].type==='comment'))r++;

          if(r<bodyEnd){
            let rEnd=r;
            let rDepth=0;

            while(rEnd<bodyEnd){
              const x=tokens[rEnd];

              if(x.type==='op'){
                if(x.value==='('||x.value==='{'||x.value==='[')rDepth++;
                else if(x.value===')'||x.value==='}'||x.value===']'){
                  if(rDepth>0)rDepth--;
                }else if(x.value===';'&&rDepth===0){
                  break;
                }
              }

              if(rDepth===0&&x.type==='keyword'&&(x.value==='return'||x.value==='local')){
                break;
              }

              rEnd++;
            }

            let parts=[];
            let partStart=r;
            let partDepth=0;

            for(let q=r;q<=rEnd;q++){
              const x=q<rEnd?tokens[q]:null;

              if(x&&x.type==='op'){
                if(x.value==='('||x.value==='{'||x.value==='[')partDepth++;
                else if(x.value===')'||x.value==='}'||x.value===']'){
                  if(partDepth>0)partDepth--;
                }else if(x.value===','&&partDepth===0){
                  parts.push([partStart,q]);
                  partStart=q+1;
                }
              }
            }

            if(partStart<rEnd)parts.push([partStart,rEnd]);

            for(const pair of parts){
              const retCode=compileVMExpression(
                tokens,pair[0],pair[1],constant
              );
              for(const ins of retCode)output.push(ins);
            }

            output.push({op:'RETURN',arg:parts.length});
            k=rEnd;
            continue;
          }
        }

        if(tokens[k].type==='name'){
          const name=tokens[k].value;
          let eq=k+1;

          while(eq<bodyEnd&&(tokens[eq].type==='ws'||tokens[eq].type==='comment'))eq++;

          if(eq<bodyEnd&&tokens[eq].type==='op'&&tokens[eq].value==='='){
            let v=eq+1;

            while(v<bodyEnd&&(tokens[v].type==='ws'||tokens[v].type==='comment'))v++;

            let vEnd=v;
            let vDepth=0;

            while(vEnd<bodyEnd){
              const x=tokens[vEnd];

              if(x.type==='op'){
                if(x.value==='('||x.value==='{'||x.value==='[')vDepth++;
                else if(x.value===')'||x.value==='}'||x.value===']'){
                  if(vDepth>0)vDepth--;
                }else if(x.value===';'&&vDepth===0){
                  break;
                }
              }

              if(vDepth===0&&x.type==='keyword'&&
                 (x.value==='return'||
                  x.value==='local'||
                  x.value==='if'||
                  x.value==='for'||
                  x.value==='while'||
                  x.value==='do'||
                  x.value==='repeat')){
                break;
              }

              if(vDepth===0&&x.type==='name'){
                let q=vEnd+1;
                while(q<bodyEnd&&(tokens[q].type==='ws'||tokens[q].type==='comment'))q++;
                if(q<bodyEnd&&tokens[q].type==='op'&&tokens[q].value==='='){
                  break;
                }
              }

              vEnd++;
            }

            const valueCode=compileVMExpression(tokens,v,vEnd,constant);
            for(const ins of valueCode)output.push(ins);
            output.push({op:'STORE',arg:constant(name)});

            k=vEnd;
            continue;
          }
        }

        k++;
      }

      output.push({op:'PUSHK',arg:constant(undefined)});
      output.push({op:'RETURN'});
      output.push(vmLabel(endLabel));

      i=bodyEnd+1;
      continue;
    }

    if(t.type==='number'){
      output.push({op:'PUSHK',arg:constant(Number(t.value))});
      i++;
      continue;
    }

    if(t.type==='string'){
      output.push({op:'PUSHK',arg:constant(parseLuaString(t.value))});
      i++;
      continue;
    }

    if(t.type==='name'){
      let pos=i;

      output.push({op:'LOAD',arg:constant(t.value)});
      pos++;

      while(pos<end){
        while(pos<end&&(tokens[pos].type==='ws'||tokens[pos].type==='comment'))pos++;
        if(pos>=end)break;

        // .property
        if(tokens[pos].type==='op'&&tokens[pos].value==='.'){
          pos++;
          while(pos<end&&(tokens[pos].type==='ws'||tokens[pos].type==='comment'))pos++;

          if(pos>=end||tokens[pos].type!=='name')break;

          output.push({op:'PUSHK',arg:constant(tokens[pos].value)});
          output.push({op:'GETTABLE'});
          pos++;
          continue;
        }

        // [key]
        if(tokens[pos].type==='op'&&tokens[pos].value==='['){
          let keyStart=pos+1;
          let j=keyStart;
          let depth=1;

          while(j<end&&depth>0){
            if(tokens[j].type==='op'){
              if(tokens[j].value==='[')depth++;
              else if(tokens[j].value===']')depth--;
            }
            if(depth>0)j++;
          }

          if(depth!==0)break;

          const keyCode=compileVMExpression(tokens,keyStart,j,constant);
          for(const ins of keyCode)output.push(ins);

          output.push({op:'GETTABLE'});
          pos=j+1;
          continue;
        }

        // (...) call current value
        if(tokens[pos].type==='op'&&tokens[pos].value==='('){
          let j=pos+1;
          let depth=1;
          const args=[];

          while(j<end&&depth>0){
            while(j<end&&(tokens[j].type==='ws'||tokens[j].type==='comment'))j++;
            if(j>=end)break;

            if(tokens[j].type==='op'&&tokens[j].value==='('){
              depth++;
              j++;
              continue;
            }

            if(tokens[j].type==='op'&&tokens[j].value===')'){
              depth--;
              j++;
              continue;
            }

            const argStart=j;
            let argDepth=0;

            while(j<end){
              const x=tokens[j];

              if(x.type==='op'){
                if(x.value==='('||x.value==='{'||x.value==='['){
                  argDepth++;
                }else if(x.value===')'||x.value==='}'||x.value===']'){
                  if(argDepth>0)argDepth--;
                  else break;
                }else if(x.value===','&&argDepth===0){
                  break;
                }
              }

              j++;
            }

            if(j>argStart)args.push([argStart,j]);

            if(j<end&&tokens[j].type==='op'&&tokens[j].value===',')j++;
          }

          for(const pair of args){
            const compiled=compileVMExpression(
              tokens,
              pair[0],
              pair[1],
              constant
            );
            for(const ins of compiled)output.push(ins);
          }

          output.push({op:'CALLVALUE',arg:args.length});
          pos=j;
          continue;
        }

        break;
      }

      i=pos;
      continue;
    }

    if(t.type==='keyword'&&
       (t.value==='true'||t.value==='false'||t.value==='nil')){
      output.push({
        op:'PUSHK',
        arg:constant(
          t.value==='true' ? true :
          t.value==='false' ? false : null
        )
      });
      i++;
      continue;
    }

    if(t.type==='op'&&t.value==='('){
      let depth=1;
      let j=i+1;

      while(j<end&&depth>0){
        if(tokens[j].type==='op'){
          if(tokens[j].value==='(')depth++;
          else if(tokens[j].value===')')depth--;
        }
        if(depth>0)j++;
      }

      if(depth!==0){
        output.push({op:'TOKEN',arg:constant(t.value)});
        i++;
        continue;
      }

      const innerCode=compileVMExpression(
        tokens,
        i+1,
        j,
        constant
      );

      for(const ins of innerCode)output.push(ins);

      let pos=j+1;

      while(pos<end){
        while(pos<end&&(tokens[pos].type==='ws'||tokens[pos].type==='comment'))pos++;
        if(pos>=end)break;

        if(tokens[pos].type==='op'&&tokens[pos].value==='.'){
          pos++;
          while(pos<end&&(tokens[pos].type==='ws'||tokens[pos].type==='comment'))pos++;

          if(pos>=end||tokens[pos].type!=='name')break;

          output.push({op:'PUSHK',arg:constant(tokens[pos].value)});
          output.push({op:'GETTABLE'});
          pos++;
          continue;
        }

        if(tokens[pos].type==='op'&&tokens[pos].value==='['){
          let keyStart=pos+1;
          let k=keyStart;
          let bracketDepth=1;

          while(k<end&&bracketDepth>0){
            if(tokens[k].type==='op'){
              if(tokens[k].value==='[')bracketDepth++;
              else if(tokens[k].value===']')bracketDepth--;
            }
            if(bracketDepth>0)k++;
          }

          if(bracketDepth!==0)break;

          const keyCode=compileVMExpression(
            tokens,
            keyStart,
            k,
            constant
          );

          for(const ins of keyCode)output.push(ins);
          output.push({op:'GETTABLE'});

          pos=k+1;
          continue;
        }

        if(tokens[pos].type==='op'&&tokens[pos].value==='('){
          let k=pos+1;
          let callDepth=1;
          const args=[];

          while(k<end&&callDepth>0){
            while(k<end&&(tokens[k].type==='ws'||tokens[k].type==='comment'))k++;
            if(k>=end)break;

            if(tokens[k].type==='op'&&tokens[k].value==='('){
              callDepth++;
              k++;
              continue;
            }

            if(tokens[k].type==='op'&&tokens[k].value===')'){
              callDepth--;
              k++;
              continue;
            }

            const argStart=k;
            let argDepth=0;

            while(k<end){
              const x=tokens[k];

              if(x.type==='op'){
                if(x.value==='('||x.value==='{'||x.value==='['){
                  argDepth++;
                }else if(x.value===')'||x.value==='}'||x.value===']'){
                  if(argDepth>0)argDepth--;
                  else break;
                }else if(x.value===','&&argDepth===0){
                  break;
                }
              }

              k++;
            }

            if(k>argStart)args.push([argStart,k]);

            if(k<end&&tokens[k].type==='op'&&tokens[k].value===',')k++;
          }

          for(const pair of args){
            const compiled=compileVMExpression(
              tokens,
              pair[0],
              pair[1],
              constant
            );
            for(const ins of compiled)output.push(ins);
          }

          output.push({op:'CALLVALUE',arg:args.length});
          pos=k;
          continue;
        }

        break;
      }

      i=pos;
      continue;
    }

    if(t.type==='op'&&t.value==='('){
      ops.push('(');
      i++;
      continue;
    }

    if(t.type==='op'&&t.value===')'){
      while(ops.length&&ops[ops.length-1]!=='('){
        emitOp(ops.pop());
      }

      if(ops.length&&ops[ops.length-1]==='(')ops.pop();
      i++;
      continue;
    }

    const op=t.value;

    if((t.type==='op'||t.type==='keyword')&&
       (op==='-'||op==='not')&&
       (()=>{
         let p=i-1;
         while(p>=start&&(tokens[p].type==='ws'||tokens[p].type==='comment'))p--;
         if(p<start)return true;
         const prev=tokens[p];
         if(prev.type==='op'){
           return ['(','[','{',',','=','+','-','*','/','%','^','..','==','~=','<','>','<=','>='].includes(prev.value);
         }
         return false;
       })()
     ){
      ops.push(op==='-'?'u-':'unot');
      i++;
      continue;
    }

    if((t.type==='op'||t.type==='keyword')&&
       Object.prototype.hasOwnProperty.call(precedence,op)){
      while(ops.length&&ops[ops.length-1]!=='('){
        const top=ops[ops.length-1];
        const pTop=precedence[top];
        const pCur=precedence[op];

        if(pTop>pCur||
           (pTop===pCur&&!rightAssociative[op])){
          emitOp(ops.pop());
        }else{
          break;
        }
      }

      ops.push(op);
      i++;
      continue;
    }

    i++;
  }

  while(ops.length){
    const op=ops.pop();
    if(op!=='(')emitOp(op);
  }

  return output;
}



function compileVMIf(tokens,start,end,constant){
  let thenPos=-1;
  let elsePos=-1;
  let depth=0;

  for(let i=start;i<end;i++){
    const t=tokens[i];

    if(t.type==='op'){
      if(t.value==='(')depth++;
      else if(t.value===')')depth--;
    }

    if(depth===0&&t.type==='keyword'&&t.value==='then'){
      thenPos=i;
      break;
    }
  }

  if(thenPos<0)return null;

  depth=0;

  for(let i=thenPos+1;i<end;i++){
    const t=tokens[i];

    if(t.type==='op'){
      if(t.value==='(')depth++;
      else if(t.value===')')depth--;
    }

    if(depth===0&&t.type==='keyword'&&t.value==='else'){
      elsePos=i;
      break;
    }
  }

  const bodyEnd=elsePos>=0?elsePos:end;
  const endLabel='vm_if_end_'+start+'_'+end;
  const elseLabel='vm_if_else_'+start+'_'+end;

  function compileBranch(a,b){
    const out=[];
    let i=a;

    while(i<b){
      while(i<b&&(tokens[i].type==='ws'||tokens[i].type==='comment'))i++;
      if(i>=b)break;

      let local=false;
      if(tokens[i].type==='keyword'&&tokens[i].value==='local'){
        local=true;
        i++;
        while(i<b&&(tokens[i].type==='ws'||tokens[i].type==='comment'))i++;
      }

      if(i<b&&tokens[i].type==='name'){
        const name=tokens[i].value;
        let j=i+1;

        while(j<b&&(tokens[j].type==='ws'||tokens[j].type==='comment'))j++;

        if(j<b&&tokens[j].type==='op'&&tokens[j].value==='='){
          j++;
          while(j<b&&(tokens[j].type==='ws'||tokens[j].type==='comment'))j++;

          let k=j;
          let d=0;

          while(k<b){
            const x=tokens[k];

            if(x.type==='op'){
              if(x.value==='(')d++;
              else if(x.value===')')d--;
              else if(x.value===';'&&d===0)break;
            }

            k++;
          }

          out.push(...compileVMExpression(tokens,j,k,constant));
          out.push({op:'STORE',arg:constant(name)});
          i=k+1;
          continue;
        }
      }

      out.push({op:'TOKEN',arg:constant(tokens[i].value)});
      i++;
    }

    return out;
  }

  const code=[];
  code.push(...compileVMExpression(tokens,start,thenPos,constant));
  code.push(vmJumpIfFalse(elsePos>=0?elseLabel:endLabel));
  code.push(...compileBranch(thenPos+1,bodyEnd));

  if(elsePos>=0){
    code.push(vmJump(endLabel));
    code.push(vmLabel(elseLabel));
    code.push(...compileBranch(elsePos+1,end));
  }

  code.push(vmLabel(endLabel));
  return code;
}


function testVMBytecode(){
  const constants=[];
  const constantMap=new Map();

  const constant=value=>{
    const key=typeof value+':'+String(value);
    if(constantMap.has(key))return constantMap.get(key);

    const id=constants.length;
    constants.push(value);
    constantMap.set(key,id);
    return id;
  };

  const env={
    obj:{
      sub:{
        value:42,
        run:function(a,b){
          return a+b;
        }
      }
    }
  };

  const valueTokens=[
    {type:'name',value:'obj'},
    {type:'op',value:'.'},
    {type:'name',value:'sub'},
    {type:'op',value:'.'},
    {type:'name',value:'value'}
  ];

  const valueCode=compileVMExpression(
    valueTokens,
    0,
    valueTokens.length,
    constant
  );

  const valueResult=runVMBytecode(
    {
      version:1,
      constants,
      code:[...valueCode,{op:'HALT'}]
    },
    env
  );

  if(valueResult!==42){
    throw new Error(
      "VM #25 NESTED PROPERTY FAILED: "+String(valueResult)
    );

  const callTokens=[

    {type:'op',value:'.'},

  if(callResult!==42){

  const bracketValueTokens=[

  const bracketValueCode=compileVMExpression(

  const bracketValueResult=runVMBytecode(
    {
      version:1,

    env
  );

  if(bracketValueResult!==42){
    throw new Error(
      "VM #26 NESTED BRACKET ACCESS FAILED: "+String(bracketValueResult)
    );
  }

  const bracketCallTokens=[
    {type:'name',value:'obj'},
    {type:'op',value:'['},
    {type:'string',value:'sub'},
    {type:'op',value:']'},
    {type:'op',value:'.'},
    {type:'name',value:'run'},
    {type:'op',value:'('},
    {type:'number',value:'19'},
    {type:'op',value:','},
    {type:'ws',value:' '},
    {type:'number',value:'23'},
    {type:'op',value:')'}
  ];

  const bracketCallCode=compileVMExpression(
    bracketCallTokens,
    0,
    bracketCallTokens.length,
    constant
  );

  const bracketCallResult=runVMBytecode(
    {
      version:1,
      constants,
      code:[...bracketCallCode,{op:'HALT'}]
    },
    env
  );

  if(bracketCallResult!==42){
    throw new Error(
      "VM #26 BRACKET PROPERTY METHOD CALL FAILED: "+String(bracketCallResult)
    );
  }

  const mixed1Tokens=[
    {type:'name',value:'obj'},
    {type:'op',value:'.'},
    {type:'name',value:'sub'},
    {type:'op',value:'['},
    {type:'string',value:'value'},
    {type:'op',value:']'}
  ];

  const mixed1Code=compileVMExpression(
    mixed1Tokens,0,mixed1Tokens.length,constant
  );

  const mixed1Result=runVMBytecode(
    {version:1,constants,code:[...mixed1Code,{op:'HALT'}]},
    env
  );

  if(mixed1Result!==42){

function packVMBytecode(vm,key){
  key=(key||83)&255;
  const raw=JSON.stringify(vm);
  let out='';
  for(let i=0;i<raw.length;i++){
    const c=raw.charCodeAt(i)&255;
    out+='\\'+(c^key).toString().padStart(3,'0');
  }
  return {key,data:out};
}

function unpackVMBytecode(packed){
  const key=packed.key&255;
  const raw=packed.data.replace(/\\(\d{3})/g,function(_,v){
    return String.fromCharCode((parseInt(v,10)^key)&255);
  });
  return JSON.parse(raw);
}

function runVMBytecode(vm,env){
  const stack=[];
  const globals=env||{};
  const callStack=[];
  const frames=[];
  let pc=0;

  while(pc<vm.code.length){
    const ins=vm.code[pc++];

    switch(ins.op){
      case 'PUSHK':
        stack.push(vm.constants[ins.arg]);
        break;

      case 'LOAD':
        stack.push(globals[vm.constants[ins.arg]]);
        break;

      case 'STORE':
        globals[vm.constants[ins.arg]]=stack.pop();
        break;

      case 'JMP':
        pc=ins.arg;
        break;

      case 'JZ':
        if(!stack.pop())pc=ins.arg;
        break;

      case 'JNZ':
        if(stack.pop())pc=ins.arg;
        break;

      case 'CALL': {
        const target=typeof ins.arg==='object'?ins.arg.target:ins.arg;
        const argc=typeof ins.arg==='object'?(ins.arg.args||0):0;
        const args=argc>0?stack.splice(stack.length-argc,argc):[];
        callStack.push(pc);
        frames.push({args});
        pc=target;
        break;
      }

      case 'ARG': {
        const frame=frames[frames.length-1];
        stack.push(frame&&frame.args?frame.args[ins.arg]:undefined);
        break;
      }

      case 'MAKEFUNC':
        stack.push({__vmFunction:true,target:ins.arg});
        break;

      case 'NEWTABLE':
        stack.push({});
        break;

      case 'TABLESET':
        {
          const value=stack.pop();
          const index=ins.arg;
          const obj=stack[stack.length-1];
          if(obj==null)throw new Error('VM TABLESET on nil');
          obj[index]=value;
        }
        break;

      case 'FOR_INIT': {
        const step=ins.step===undefined?1:ins.step;
        const limit=stack.pop();
        const start=stack.pop();
        stack.push({current:start,limit,step});
        break;
      }

      case 'FOR_CHECK': {
        const loop=stack[stack.length-1];
        if(!loop)throw new Error('VM FOR_CHECK without loop state');
        const ok=loop.step>=0?loop.current<=loop.limit:loop.current>=loop.limit;
        stack.push(ok);
        break;
      }

      case 'FOR_STEP': {
        const loop=stack[stack.length-1];
        if(!loop)throw new Error('VM FOR_STEP without loop state');
        loop.current+=loop.step;
        break;
      }

      case 'FOR_VALUE': {
        const loop=stack[stack.length-1];
        if(!loop)throw new Error('VM FOR_VALUE without loop state');
        stack.push(loop.current);
        break;
      }

      case 'FOR_POP':
        stack.pop();
        break;

      case 'BREAK':
        pc=ins.arg;
        break;

      case 'GETTABLE': {
        const key=stack.pop();
        const obj=stack.pop();
        stack.push(obj==null?undefined:obj[key]);
        break;
      }

      case 'SETTABLE': {
        const value=stack.pop();
        const key=stack.pop();
        const obj=stack.pop();
        if(obj==null)throw new Error('VM SETTABLE on nil');
        obj[key]=value;
        stack.push(obj);
        break;
      }

      case 'CALLFUNC': {
        const argc=ins.arg||0;
        const args=argc>0?stack.splice(stack.length-argc,argc):[];
        const fn=stack.pop();

        if(!fn||fn.__vmFunction!==true){
          throw new Error('VM invalid function value');
        }

        callStack.push(pc);
        frames.push({args});
        pc=fn.target;
        break;
      }

      case 'CALLVALUE': {
        const argc=ins.arg||0;
        const args=argc>0?stack.splice(stack.length-argc,argc):[];
        const fn=stack.pop();

        if(typeof fn!=='function'){
          throw new Error('VM invalid value call');
        }

        const result=fn.apply(null,args);

        if(Array.isArray(result)){
          for(let i=0;i<result.length;i++)stack.push(result[i]);
        }else{
          stack.push(result);
        }
        break;
      }

      case 'CALLHOST': {
        const argc=ins.arg||0;
        const args=argc>0?stack.splice(stack.length-argc,argc):[];
        const fn=stack.pop();
        if(typeof fn!=='function'){
          throw new Error('VM invalid host call');
        }
        const result=fn.apply(null,args);
        if(Array.isArray(result)){
          for(let i=0;i<result.length;i++)stack.push(result[i]);
        }else{
          stack.push(result);
        }
        break;
      }

      case 'RETURN': {
        const argc=ins.arg==null?1:ins.arg;
        const values=argc>0?stack.splice(stack.length-argc,argc):[];

        if(!callStack.length){
          if(argc<=1)return values.length?values[0]:undefined;
          return {__vmMultiReturn:true,values};
        }

        pc=callStack.pop();
        frames.pop();

        if(argc<=1){
          if(values.length)stack.push(values[0]);
        }else{
          stack.push({__vmMultiReturn:true,values});
        }

        break;
      }

      case 'TOKEN':
        stack.push(vm.constants[ins.arg]);
        break;

      case 'UNARY': {
        const op=vm.constants[ins.arg];
        const a=stack.pop();

        if(op==='not'){
          stack.push(!a);
        }else if(op==='-'){
          stack.push(-a);
        }else{
          throw new Error('VM unknown unary operator: '+String(op));
        }
        break;
      }

      case 'LOGIC': {
        const op=vm.constants[ins.arg];
        const b=stack.pop();
        const a=stack.pop();

        if(op==='and'){
          stack.push(a && b);
        }else if(op==='or'){
          stack.push(a || b);
        }else{
          throw new Error('VM unknown logic operator: '+String(op));
        }
        break;
      }

      case 'BIN': {
        const b=stack.pop();
        const a=stack.pop();
        const op=vm.constants[ins.arg];
        let r;
        if(op==='+')r=a+b;
        else if(op==='-')r=a-b;
        else if(op==='*')r=a*b;
        else if(op==='/')r=a/b;
        else if(op==='%')r=a%b;
        else if(op==='^')r=a**b;
        else if(op==='..')r=String(a)+String(b);
        else if(op==='==')r=a===b;
        else if(op==='~=')r=a!==b;
        else if(op==='<')r=a<b;
        else if(op==='>')r=a>b;
        else if(op==='<=')r=a<=b;
        else if(op==='>=')r=a>=b;
        else throw new Error('VM invalid binary operator');
        stack.push(r);
        break;
      }

      case 'POP':
        stack.pop();
        break;

      case 'HALT':
        return stack.length?stack[stack.length-1]:undefined;

      default:
        throw new Error('VM unknown opcode: '+String(ins.op));
    }
  }

  return stack.length?stack[stack.length-1]:undefined;
}


function assembleVM(instructions){
  const labels=new Map();
  const code=[];
  for(const ins of instructions){
    if(ins.op==='LABEL'){
      labels.set(ins.arg,code.length);
    }else{
      code.push({...ins});
    }
  }

  for(const ins of code){
    if(typeof ins.arg==='string'&&labels.has(ins.arg)){
      ins.arg=labels.get(ins.arg);
    }
  }

  return code;
}

function encodeVMBytecode(vm){
  const raw=JSON.stringify(vm);
  let out='';
  for(let i=0;i<raw.length;i++){
    out+='\\'+raw.charCodeAt(i).toString().padStart(3,'0');
  }
  return out;
}



function serializeVMForLua(vm){
  const constants=(vm.constants||[]).map(luaVMQuote).join(',');
  const code=(vm.code||[]).map(function(ins){
    const op=luaVMQuote(ins.op);
    const arg=ins.arg===undefined?'nil':luaVMQuote(ins.arg);
    return '{op='+op+',arg='+arg+'}';
  }).join(',');

  return '{version='+(Number(vm.version)||1)+
         ',constants={'+constants+'},code={'+code+'}}';
}


function buildLuaVMRuntime(vm){
  const payload=serializeVMForLua(vm);

  return `
local __VM=${payload}

local function __vm_run(__env)
  local __code=__VM.code
  local __const=__VM.constants
  local __stack={}
  local __locals=__env or {}                            local __args={}
  local __pc=1

  local function __push(v)
    __stack[#__stack+1]=v
  end

  local function __pop()
    local n=#__stack
    local v=__stack[n]
    __stack[n]=nil
    return v
  end

  local function __truthy(v)
    return v~=nil and v~=false
  end

  while true do
    local __ins=__code[__pc]
    if not __ins then
      return
    end

    local __op=__ins.op
    local __arg=__ins.arg

    if __op=="PUSHK" then
      __push(__const[__arg+1])

    elseif __op=="LOAD" then
      local __name=__const[__arg+1]
      local __value=__locals[__name]
      if __value==nil and __env~=nil then
        __value=__env[__name]
      end
      if __value==nil then
        __value=_G[__name]
      end
      __push(__value)

    elseif __op=="STORE" then
      local __name=__const[__arg+1]
      __locals[__name]=__pop()

    elseif __op=="JMP" then
      __pc=__arg

    elseif __op=="JZ" then
      local __v=__pop()
      if not __truthy(__v) then
        __pc=__arg
      end

    elseif __op=="JNZ" then
      local __v=__pop()
      if __truthy(__v) then
        __pc=__arg
      end

    elseif __op=="CALLVALUE" then
      local __argc=__arg or 0
      local __callArgs={}
      for __i=__argc,1,-1 do
        __callArgs[__i]=__pop()
      end
      local __fn=__pop()
      if type(__fn)~="function" then
        error("NullFuscator VM: invalid value call")
      end
      local __ok,__result=pcall(function()
        return __fn(table.unpack(__callArgs))
      end)
      if not __ok then
        error(__result)
      end
      __push(__result)

    elseif __op=="CALL" then
      local __argc=__arg or 0
      local __callArgs={}
      for __i=__argc,1,-1 do
        __callArgs[__i]=__pop()
      end
      local __fn=__pop()
      if type(__fn)~="function" then
        error("NullFuscator VM: attempted to call non-function")
      end
      __args[#__args+1]=__callArgs
      local __ok,__result=pcall(function()
        return __fn(table.unpack(__callArgs))
      end)
      __args[#__args]=nil
      if not __ok then
        error(__result)
      end
      __push(__result)

    elseif __op=="ARG" then
      local __frame=__args[#__args]
      __push(__frame and __frame[__arg] or nil)

    elseif __op=="UNARY" then
      local __operator=__const[__arg+1]
      local __v=__pop()
      if __operator=="not" then
        __push(not __truthy(__v))
      elseif __operator=="-" then
        __push(-__v)
      else
        error("NullFuscator VM: unsupported unary operator")
      end

    elseif __op=="LOGIC" then
      local __operator=__const[__arg+1]
      local __b=__pop()
      local __a=__pop()
      if __operator=="and" then
        if __truthy(__a) then __push(__b) else __push(__a) end
      elseif __operator=="or" then
        if __truthy(__a) then __push(__a) else __push(__b) end
      else
        error("NullFuscator VM: unsupported logic operator")
      end

    elseif __op=="BIN" then
      local __operator=__const[__arg+1]
      local __b=__pop()
      local __a=__pop()

      if __operator=="+" then __push(__a+__b)
      elseif __operator=="-" then __push(__a-__b)
      elseif __operator=="*" then __push(__a*__b)
      elseif __operator=="/" then __push(__a/__b)
      elseif __operator=="%" then __push(__a%__b)
      elseif __operator=="^" then __push(__a^__b)
      elseif __operator==".." then __push(__a..__b)
      elseif __operator=="==" then __push(__a==__b)
      elseif __operator=="~=" then __push(__a~=__b)
      elseif __operator=="<" then __push(__a<__b)
      elseif __operator==">" then __push(__a>__b)
      elseif __operator=="<=" then __push(__a<=__b)
      elseif __operator==">=" then __push(__a>=__b)
      else
        error("NullFuscator VM: unsupported binary operator")
      end

    elseif __op=="GETTABLE" then
      local __key=__pop()
      local __obj=__pop()
      if __obj==nil then
        __push(nil)
      else
        __push(__obj[__key])
      end

    elseif __op=="POP" then
      __pop()

    elseif __op=="RETURN" then
      return __pop()

    elseif __op=="HALT" then
      return

    else
      error("NullFuscator VM: unsupported opcode "..tostring(__op))
    end

    __pc=__pc+1
  end
end

return __vm_run()
`;
}

function obfuscateLua(src,opts){
  opts=opts||{};
  const seed=opts.seed||Date.now();
  let _s=seed;
  const rng=function(){_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff;};

  const sourceTokens=tokenize(src);
  let __stmt=0,__paren=0,__bracket=0,__brace=0;
  const tokens=[];

  for(let ti=0;ti<sourceTokens.length;ti++){
    const st=sourceTokens[ti];

    if(st.type==='ws'){
      if(/\n/.test(st.value)&&__paren===0&&__bracket===0&&__brace===0){
        const next=sourceTokens[ti+1];
        if(next&&next.type!=='comment')__stmt++;
      }
      continue;
    }

    if(st.type==='comment')continue;

    st._stmt=__stmt;

    if(st.type==='op'){
      if(st.value==='(')__paren++;
      else if(st.value===')')__paren=Math.max(0,__paren-1);
      else if(st.value==='[')__bracket++;
      else if(st.value===']')__bracket=Math.max(0,__bracket-1);
      else if(st.value==='{')__brace++;
      else if(st.value==='}')__brace=Math.max(0,__brace-1);
    }

    tokens.push(st);
  }

  const locals=collectLocals(tokens);
  const usedNames=new Set();
  for(const t of tokens)if(t.type==='name')usedNames.add(t.value);
  function freshName(){let n;do{n='_'+Math.random().toString(36).slice(2,8);}while(usedNames.has(n)||KEYWORDS.has(n));usedNames.add(n);return n;}

  const bxName=freshName();
  const dName=freshName();
  const tamperFlag=freshName();
  const strTableName=freshName();
  const strGetName=freshName();

  const renameMap=new Map();
  if(opts.rename!==false){
    for(const name of locals){
      if(GLOBALS.has(name))continue;
      if(name===bxName||name===dName||name===tamperFlag||name===strTableName)continue;
      renameMap.set(name,freshName());
    }
  }

  const stringTable=[];
  let braceDepth=0;
  const out=[];
  for(let i=0;i<tokens.length;i++){
    const t=tokens[i];
    if(t.type==='op'){
      if(t.value==='{')braceDepth++;
      else if(t.value==='}')braceDepth--;
      out.push(t);
      continue;
    }
    if(t.type==='string'){
      const decoded=parseLuaString(t.value);
      if(opts.stringArray){
        stringTable.push(opts.chunkStrings?encodeStringChunked(decoded,dName):encodeString(decoded,dName));
        out.push({type:'raw',value:strGetName+'('+stringTable.length+')',_stmt:t._stmt});
      }else{
        out.push({type:'raw',value:opts.chunkStrings?encodeStringChunked(decoded,dName):encodeString(decoded,dName),_stmt:t._stmt});
      }
      continue;
    }
    if(t.type==='number'){
      out.push({type:'raw',value:encodeNumber(t.value,!!opts.numExpr),numeric:true,_stmt:t._stmt});
      continue;
    }
    if(t.type==='name'){
      const prev=out.length?out[out.length-1]:null;
      if(prev&&prev.type==='op'&&(prev.value==='.'||prev.value===':'||prev.value==='::')){
        out.push(t);
        continue;
      }
      if(prev&&prev.type==='keyword'&&prev.value==='goto'){
        out.push(t);
        continue;
      }
      const nx0=tokens[i+1];
      if(nx0&&nx0.type==='op'&&nx0.value==='::'){
        out.push(t);
        continue;
      }
      if(braceDepth>0&&nx0&&nx0.type==='op'&&nx0.value==='='){
        out.push(t);
        continue;
      }
      if(renameMap.has(t.value))out.push({type:'raw',value:renameMap.get(t.value),_stmt:t._stmt});
      else out.push(t);
      continue;
    }
    out.push(t);
  }

  let finalTokens=out;
  if(opts.deadCode&&opts.deadCode>0){
    finalTokens=injectDeadCode(out,rng,opts.deadCode,opts.opaquePredicates||0);
  }

  let pre='';
  if(stringTable.length>0){
    if(opts.stringArray){
      const order=stringTable.map((_,i)=>i);
      for(let i=order.length-1;i>0;i--){
        const j=Math.floor(rng()*(i+1));
        const tmp=order[i];
        order[i]=order[j];
        order[j]=tmp;
      }
      const shuffled=order.map(i=>stringTable[i]);
      const indexMap=[];
      for(let i=0;i<order.length;i++)indexMap[order[i]]=i+1;
      const mapKey=1+Math.floor(rng()*255);
      const encodedMap=indexMap.map(v=>bxName+'('+v+','+mapKey+')');
      pre='local '+strTableName+'={'+shuffled.join(',')+'}\n';
      pre+='local '+strGetName+'Map={'+encodedMap.join(',')+'}\n';
      pre+='local '+strGetName+'=function(i) return '+strTableName+'['+bxName+'('+strGetName+'Map[i],'+mapKey+')] end\n';
    }else{
      pre='local '+strTableName+'={'+stringTable.join(',')+'}\n';
    }
  }

  const body=generateVM(finalTokens);
  const antiTamper=opts.antiTamper?buildAntiTamper(tamperFlag):'';
  const header=buildHeader(bxName,dName);
  const watermark='--[[ NullFuscator-WM:'+Math.random().toString(36).slice(2,10)+' ]]\n';

  const vmTokens=tokenize(body).filter(t=>t.type!=='comment'&&t.type!=='ws');

const vmBytecode=buildVMBytecode(vmTokens);
  const vmRuntime=buildLuaVMRuntime(vmBytecode);

  const vmEnvName=freshName();
  const vmEnvParts=[
    bxName+'='+bxName,
    dName+'='+dName
  ];
  if(opts.stringArray){
    vmEnvParts.push(strGetName+'='+strGetName);
  }
  if(opts.antiTamper){
    vmEnvParts.push(tamperFlag+'='+tamperFlag);
  }

  const vmEnv='local '+vmEnvName+'={'+vmEnvParts.join(',')+'}\n';
  const vmEntry=vmRuntime.replace(
    'return __vm_run()',
    'return __vm_run('+vmEnvName+')'
  );

  return BANNER+watermark+header+pre+antiTamper+vmEnv+vmEntry;
}

function generateVM(tokens){
  let out='',prev=null,prevStmt=null;
  for(const t of tokens){
    const stmt=t._stmt;

    if(prev&&stmt!==undefined&&prevStmt!==undefined&&stmt!==prevStmt){
      out+=';';
    }else if(prev&&needsSpace(prev,t)){
      out+=' ';
    }

    out+=t.value;
    prev=t;
    if(stmt!==undefined)prevStmt=stmt;
  }

  return out;
}

function generate(tokens){
  let out='',prev=null;
  for(const t of tokens){
    if(prev&&needsSpace(prev,t))out+=' ';
    out+=t.value;prev=t;
  }
  return out;
}

function needsSpace(a,b){
  const aLast=a.value[a.value.length-1],bFirst=b.value[0];
  const aWord=/[A-Za-z0-9_]/.test(aLast),bWord=/[A-Za-z0-9_]/.test(bFirst);

  if(aWord&&bWord)return true;

  // Prevent generated numeric literals from merging with identifiers.
  // Example: "(0x5)_abc" must remain "(0x5) _abc".
  if(a.numeric&&/[A-Za-z_]/.test(bFirst))return true;
  if(b.numeric&&/[A-Za-z_]/.test(aLast))return true;

  if(a.value==='-'&&bFirst==='-')return true;
  if(a.value.endsWith('..')&&b.numeric)return true;
  if(a.numeric&&b.value.startsWith('..'))return true;
  if(a.value==='['&&(bFirst==='['||bFirst==='='))return true;
  return false;
}

self.onmessage=function(e){
  const{src,opts}=e.data;
  try{
    const t0=Date.now();
    const result=obfuscateLua(src,opts);
    self.postMessage({ok:true,result,ms:Date.now()-t0});
  }catch(err){
    self.postMessage({ok:false,error:err.message||String(err)});
  }
};

</script>

<!-- ================== MAIN PAGE SCRIPT ================== -->
<script>
/* ---- Mode presets ---- */
const MODES = {
  weak:        { label:'Weak',        desc:'Fast, minimal. Good for debugging.',        tag:'fast',  string:true, number:true, rename:true, deadCode:0,    opaquePredicates:0, antiTamper:false, numExpr:false, chunkStrings:false, stringArray:false },
  normal:      { label:'Normal',      desc:'Balanced default.',                        tag:'',      string:true, number:true, rename:true, deadCode:0.15, opaquePredicates:0.05, antiTamper:false, numExpr:false, chunkStrings:false, stringArray:false },
  strong:      { label:'Strong',      desc:'More bloat, harder to read.',              tag:'',      string:true, number:true, rename:true, deadCode:0.30, opaquePredicates:0.15, antiTamper:false, numExpr:false, chunkStrings:false, stringArray:false },
  superStrong: { label:'Super Strong',desc:'Chunked strings + heavier bloat.',         tag:'mid',   string:true, number:true, rename:true, deadCode:0.45, opaquePredicates:0.25, antiTamper:false, numExpr:false, chunkStrings:true,  stringArray:false },
  ultra:       { label:'Ultra',       desc:'Anti-tamper + all of the above.',          tag:'mid',   string:true, number:true, rename:true, deadCode:0.45, opaquePredicates:0.35, antiTamper:true,  numExpr:false, chunkStrings:true,  stringArray:false },
  extreme:     { label:'Extreme',     desc:'Numeric expressions + heavy bloat.',       tag:'hot',   string:true, number:true, rename:true, deadCode:0.60, opaquePredicates:0.45, antiTamper:true,  numExpr:true,  chunkStrings:true,  stringArray:false },
  evil:        { label:'Evil',        desc:'Maximum protection. Slowest runtime.',     tag:'hot',   string:true, number:true, rename:true, deadCode:0.75, opaquePredicates:0.60, antiTamper:true,  numExpr:true,  chunkStrings:true,  stringArray:true  }
};
let currentMode = localStorage.getItem('nf-mode') || 'normal';
if (!MODES[currentMode]) currentMode = 'normal';

/* ---- Custom dropdown ---- */
const dropdown = document.getElementById('modeDropdown');
const modeBtn  = document.getElementById('modeBtn');
const modeMenu = document.getElementById('modeMenu');
const modeLabel= document.getElementById('modeLabel');

function buildMenu() {
  modeMenu.innerHTML = '';
  for (const [key, m] of Object.entries(MODES)) {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.mode = key;
    if (key === currentMode) b.classList.add('active');
    const tagCls = m.tag === 'hot' ? 'hot' : m.tag === 'mid' ? 'mid' : '';
    b.innerHTML = '<span class="mode-name"><span>' + m.label + '</span>' + (m.tag ? '<span class="tag '+tagCls+'">'+m.tag.toUpperCase()+'</span>' : '') + '</span><span class="mode-desc">' + m.desc + '</span>';
    b.addEventListener('click', () => {
      currentMode = key;
      localStorage.setItem('nf-mode', key);
      modeLabel.textContent = m.label;
      buildMenu();
      dropdown.classList.remove('open');
    });
    modeMenu.appendChild(b);
  }
}
modeLabel.textContent = MODES[currentMode].label;
buildMenu();

modeBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  dropdown.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!dropdown.contains(e.target)) dropdown.classList.remove('open');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') dropdown.classList.remove('open');
});

/* ---- Worker ---- */
const workerCode = document.getElementById('obfWorker').textContent;
const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
const worker = new Worker(URL.createObjectURL(workerBlob));

/* ---- DOM ---- */
const input = document.getElementById('input'), output = document.getElementById('output');
const obfBtn = document.getElementById('obfBtn'), copyBtn = document.getElementById('copyBtn');
const downloadBtn = document.getElementById('downloadBtn'), clearBtn = document.getElementById('clearBtn');
const inCount = document.getElementById('inCount'), outCount = document.getElementById('outCount');
const outRatio = document.getElementById('outRatio');
const fileInput = document.getElementById('fileInput'), uploadBtn = document.getElementById('uploadBtn');
const fileName = document.getElementById('fileName');

function bytesLabel(b) { if (b < 1024) return b + ' B'; if (b < 1048576) return (b/1024).toFixed(2) + ' KB'; return (b/1048576).toFixed(2) + ' MB'; }

/* ---- Debounced byte counter (fixes lag on big paste) ---- */
let inTimer = null;
input.addEventListener('input', () => {
  if (inTimer) clearTimeout(inTimer);
  inTimer = setTimeout(() => { inCount.textContent = bytesLabel(new Blob([input.value]).size); }, 120);
});

/* ---- File upload ---- */
uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    input.value = reader.result;
    inCount.textContent = bytesLabel(new Blob([input.value]).size);
    fileName.textContent = f.name + ' · ' + bytesLabel(f.size);
  };
  reader.readAsText(f);
  fileInput.value = '';
});

/* ---- Obfuscate (via worker) ---- */
let busy = false;
obfBtn.addEventListener('click', () => {
  if (busy) return;
  const src = input.value;
  if (!src.trim()) {
    output.classList.add('error');
    output.textContent = 'Please paste some Lua code first.';
    return;
  }
  busy = true;
  obfBtn.disabled = true;
  obfBtn.innerHTML = '<span class="spinner"></span>Working…';
  output.classList.remove('error');
  const mode = MODES[currentMode];
  worker.postMessage({ src, opts: { ...mode, seed: Date.now() } });
});

worker.onmessage = (e) => {
  busy = false;
  obfBtn.disabled = false;
  obfBtn.textContent = 'Obfuscate';
  if (e.data.ok) {
    const result = e.data.result;
    output.textContent = result;
    const b = new Blob([result]).size;
    outCount.textContent = bytesLabel(b);
    const inB = new Blob([input.value]).size || 1;
    outRatio.textContent = '(' + (b / inB).toFixed(2) + '× · ' + e.data.ms + 'ms)';
    copyBtn.disabled = false;
    downloadBtn.disabled = false;
    output.classList.remove('flash'); void output.offsetWidth; output.classList.add('flash');
  } else {
    output.classList.add('error');
    output.textContent = 'Error: ' + e.data.error;
    outCount.textContent = '—';
    outRatio.textContent = '';
    copyBtn.disabled = true;
    downloadBtn.disabled = true;
  }
};

/* ---- Copy ---- */
copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(output.textContent);
    copyBtn.textContent = 'Copied ✓';
    setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1400);
  } catch {
    copyBtn.textContent = 'Copy failed';
    setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1400);
  }
});

/* ---- Download ---- */
downloadBtn.addEventListener('click', () => {
  const text = output.textContent;
  const blob = new Blob([text], { type: 'text/x-lua' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const mode = currentMode;
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.href = url;
  a.download = 'nullfuscated-' + mode + '-' + stamp + '.lua';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  downloadBtn.textContent = 'Saved ✓';
  setTimeout(() => { downloadBtn.textContent = 'Download'; }, 1400);
});

/* ---- Clear ---- */
clearBtn.addEventListener('click', () => {
  input.value = '';
  inCount.textContent = '0 B';
  fileName.textContent = '';
  output.innerHTML = '<span class="placeholder">Obfuscated code will appear here…</span>';
  outCount.textContent = '0 B';
  outRatio.textContent = '';
  copyBtn.disabled = true;
  downloadBtn.disabled = true;
  output.classList.remove('error');
});
</script>
</body>
