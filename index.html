<!DOCTYPE html>

<style>
  :root{--bg:#0a0a0a;--panel:#111;--panel-2:#161616;--border:#262626;--border-hi:#3a3a3a;--text:#e5e5e5;--muted:#8a8a8a;--dim:#5a5a5a;--shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.4)}
  *{box-sizing:border-box}html,body{margin:0;padding:0}

<body>
<div class="app">
  <header>
    <h1>NullFuscator</h1>
    <p class="subtitle"><span class="dot"></span>Lua Obfuscation Engine · Anti-Tamper</p>
  </header>
  <section class="panel">
    <div class="panel-header"><span>Input · Lua</span><span class="count" id="inCount">0 B</span></div>
    <textarea id="input" spellcheck="false" placeholder="-- paste your Lua source here&#10;local greet = function(name)&#10;  print('Hello, ' .. name .. '!')&#10;end&#10;greet('world')"></textarea>
  </section>
  <div class="actions">
    <button id="obfBtn" class="btn primary">Obfuscate</button>
    <button id="copyBtn" class="btn" disabled>Copy Output</button>
    <button id="clearBtn" class="btn ghost">Clear</button>
  </div>
  <section class="panel">
    <div class="panel-header"><span>Output · Obfuscated</span><span class="count" id="outCount">0 B</span></div>
    <pre class="output" id="output"><span class="placeholder">Obfuscated code will appear here…</span></pre>
  </section>
  <footer><b>NullFuscator</b> · client-side only · anti-tamper enabled</footer>
</div>
<script>
const KEYWORDS=new Set(['and','break','do','else','elseif','end','false','for','function','goto','if','in','local','nil','not','or','repeat','return','then','true','until','while']);
const GLOBALS=new Set(['_G','_VERSION','_ENV','assert','collectgarbage','dofile','error','getfenv','getmetatable','ipairs','load','loadfile','loadstring','module','next','pairs','pcall','print','rawequal','rawget','rawset','require','select','setfenv','setmetatable','tonumber','tostring','type','unpack','xpcall','coroutine','debug','io','math','os','package','string','table','bit32','utf8','arg','self']);

function matchLongBracket(src,i){if(src[i]!=='[')return -1;let j=i+1;while(src[j]==='=')j++;if(src[j]!=='[')return -1;return j-i-1;}
function findLongBracketEnd(src,i,level){const close=']'+'='.repeat(level)+']';const idx=src.indexOf(close,i+level+2);return idx===-1?src.length-1:idx+close.length-1;}

function tokenize(src){
  const tokens=[];const n=src.length;let i=0;
  while(i<n){
    const c=src[i];
    if(/\s/.test(c)){let j=i;while(j<n&&/\s/.test(src[j]))j++;tokens.push({type:'ws',value:src.slice(i,j)});i=j;continue;}
    if(c==='-'&&src[i+1]==='-'){
      if(src[i+2]==='['){const lvl=matchLongBracket(src,i+2);if(lvl!==-1){const end=findLongBracketEnd(src,i+2,lvl);tokens.push({type:'comment',value:src.slice(i,end+1)});i=end+1;continue;}}
      let j=i;while(j<n&&src[j]!=='\n')j++;tokens.push({type:'comment',value:src.slice(i,j)});i=j;continue;
    }
    if(c==='['){const lvl=matchLongBracket(src,i);if(lvl!==-1){const end=findLongBracketEnd(src,i,lvl);tokens.push({type:'string',value:src.slice(i,end+1)});i=end+1;continue;}}
    if(c==='"'||c==="'"){
      let j=i+1;while(j<n){if(src[j]==='\\'){j+=2;continue;}if(src[j]===c){j++;break;}if(src[j]==='\n')break;j++;}
      tokens.push({type:'string',value:src.slice(i,j)});i=j;continue;
    }
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(src[i+1]||''))){
      let j=i;
      if(c==='0'&&(src[i+1]==='x'||src[i+1]==='X')){
        j=i+2;while(j<n&&/[0-9a-fA-F.]/.test(src[j]))j++;
        if(src[j]==='p'||src[j]==='P'){j++;if(src[j]==='+'||src[j]==='-')j++;while(j<n&&/[0-9]/.test(src[j]))j++;}
      }else{
        while(j<n&&/[0-9]/.test(src[j]))j++;
        if(src[j]==='.'){j++;while(j<n&&/[0-9]/.test(src[j]))j++;}
        if(src[j]==='e'||src[j]==='E'){j++;if(src[j]==='+'||src[j]==='-')j++;while(j<n&&/[0-9]/.test(src[j]))j++;}
      }
      tokens.push({type:'number',value:src.slice(i,j)});i=j;continue;
    }
    if(/[A-Za-z_]/.test(c)){
      let j=i;while(j<n&&/[A-Za-z0-9_]/.test(src[j]))j++;
      const v=src.slice(i,j);tokens.push({type:KEYWORDS.has(v)?'keyword':'name',value:v});i=j;continue;
    }
    const three=src.substr(i,3);
    if(three==='...'){tokens.push({type:'op',value:'...'});i+=3;continue;}
    const two=src.substr(i,2);
    if(['==','~=','<=','>=','..','::','//','<<','>>'].includes(two)){tokens.push({type:'op',value:two});i+=2;continue;}
    tokens.push({type:'op',value:c});i++;
  }
  return tokens;
}

function collectLocals(tokens){
  const locals=new Set();
  for(let i=0;i<tokens.length;i++){
    const t=tokens[i];
    if(t.type==='keyword'&&t.value==='local'){
      let j=i+1;
      if(tokens[j]&&tokens[j].type==='keyword'&&tokens[j].value==='function'){
        j++;if(tokens[j]&&tokens[j].type==='name')locals.add(tokens[j].value);
      }else{
        while(j<tokens.length){
          const tk=tokens[j];
          if(tk.type==='name'){locals.add(tk.value);j++;}
          else if(tk.type==='op'&&tk.value===','){j++;}
          else break;
        }
      }
    }
    if(t.type==='keyword'&&t.value==='function'){
      let j=i+1;
      while(j<tokens.length&&tokens[j].value!=='('){if(tokens[j].type==='keyword')break;j++;}
      if(j<tokens.length&&tokens[j].value==='('){
        j++;
        while(j<tokens.length&&tokens[j].value!==')'){
          if(tokens[j].type==='name')locals.add(tokens[j].value);
          j++;
        }
      }
    }
    if(t.type==='keyword'&&t.value==='for'){
      let j=i+1;
      while(j<tokens.length){
        const tk=tokens[j];
        if(tk.type==='name'){locals.add(tk.value);j++;}
        else if(tk.type==='op'&&tk.value===','){j++;}
        else break;
      }
    }
  }
  return locals;
}

function parseLuaString(raw){
  if(raw[0]==='['){
    const level=matchLongBracket(raw,0);
    let inner=raw.slice(level+2,raw.length-level-2);
    if(inner.startsWith('\r\n'))inner=inner.slice(2);
    else if(inner.startsWith('\n'))inner=inner.slice(1);
    return inner;
  }
  const body=raw.slice(1,-1);let out='';
  for(let i=0;i<body.length;i++){
    const c=body[i];
    if(c!=='\\'){out+=c;continue;}
    const nx=body[i+1];
    switch(nx){
      case 'n':out+='\n';i++;break;
      case 't':out+='\t';i++;break;
      case 'r':out+='\r';i++;break;
      case 'a':out+='\x07';i++;break;
      case 'b':out+='\b';i++;break;
      case 'f':out+='\f';i++;break;
      case 'v':out+='\v';i++;break;
      case '\\':out+='\\';i++;break;
      case '"':out+='"';i++;break;
      case "'":out+="'";i++;break;
      case '\n':out+='\n';i++;break;
      case '\r':out+='\n';i++;if(body[i+2]==='\n')i++;break;
      case 'x':{let hex='';let j=i+2;while(j<body.length&&hex.length<2&&/[0-9a-fA-F]/.test(body[j])){hex+=body[j];j++;}out+=String.fromCharCode(parseInt(hex,16)||0);i=j-1;break;}
      case 'z':{i++;while(i+1<body.length&&/\s/.test(body[i+1]))i++;break;}
      default:
        if(nx&&/[0-9]/.test(nx)){let num='';let j=i+1;while(j<body.length&&num.length<3&&/[0-9]/.test(body[j])){num+=body[j];j++;}out+=String.fromCharCode(parseInt(num,10));i=j-1;}
        else if(nx!==undefined){out+=nx;i++;}
    }
  }
  return out;
}

function encodeString(str,dName){
  const key=1+Math.floor(Math.random()*255);
  let escaped='';
  for(let i=0;i<str.length;i++){
    let byte=str.charCodeAt(i)&0xff;
    byte=byte^key;
    escaped+='\\'+byte.toString().padStart(3,'0');
  }
  return dName+'("'+escaped+'",'+key+')';
}

function encodeNumber(numStr){
  if(/^\d+$/.test(numStr)){const n=parseInt(numStr,10);return '(0x'+n.toString(16)+')';}
  if(/^0[xX][0-9a-fA-F]+$/.test(numStr))return '('+numStr+')';
  return numStr;
}

function buildHeader(bxName,dName){
  return 'local '+bxName+'=bit32 and bit32.bxor or function(a,b)local r,p=0,1 while a>0 or b>0 do local x,y=a%2,b%2 if x~=y then r=r+p end a=(a-x)/2 b=(b-y)/2 p=p*2 end return r end '+
         'local function '+dName+'(s,k)local t={}for i=1,#s do t[i]=string.char('+bxName+'(string.byte(s,i),k))end return table.concat(t)end\n';
}

/* ============ ANTI-TAMPER WRAPPER ============ */
function buildAntiTamper(tamperFlagName, debugHookName, lineCheckName){
  const lines = [];
  lines.push('-- NullFuscator Anti-Tamper Layer');
  lines.push('local '+tamperFlagName+'=true');
  lines.push('local '+debugHookName+'=debug and debug.sethook or function()end');
  lines.push('local '+lineCheckName+'=0');
  lines.push('local function _tc()'+lineCheckName+'='+lineCheckName+'+1 end');
  lines.push('if debug and debug.sethook then');
  lines.push('  local _ok,_err=pcall(function()');
  lines.push('    debug.sethook(_tc,"l")');
  lines.push('    _tc() _tc()');
  lines.push('    debug.sethook()');
  lines.push('  end)');
  lines.push('  if not _ok or '+lineCheckName+'<2 then '+tamperFlagName+'=false end');
  lines.push('else');
  lines.push('  '+tamperFlagName+'=false');
  lines.push('end');
  lines.push('-- Function integrity checks');
  lines.push('do');
  lines.push('  local _checks={pcall,string.char,debug.getinfo,string.dump}');
  lines.push('  for _,_f in ipairs(_checks) do');
  lines.push('    local _i=debug.getinfo(_f)');
  lines.push('    if _i and _i.what~="C" then '+tamperFlagName+'=false end');
  lines.push('    if debug.getupvalue and debug.getupvalue(_f,1) then '+tamperFlagName+'=false end');
  lines.push('    local _d=pcall(string.dump,_f)');
  lines.push('    if _d then '+tamperFlagName+'=false end');
  lines.push('  end');
  lines.push('end');
  lines.push('-- Line consistency check');
  lines.push('if debug and debug.getinfo then');
  lines.push('  local _ok=pcall(function()');
  lines.push('    local _info=debug.getinfo(1,"l")');
  lines.push('    if not _info or not _info.currentline or _info.currentline<0 then '+tamperFlagName+'=false end');
  lines.push('  end)');
  lines.push('  if not _ok then '+tamperFlagName+'=false end');
  lines.push('end');
  lines.push('if not '+tamperFlagName+' then while true do end end');
  lines.push('');
  return lines.join('\n');
}

/* ============ DEAD CODE INJECTION ============ */
function generateDeadBlock(rng){
  const templates = [
    `do local _a,_b=0,1 for _i=1,math.random(5,20) do _a=_a+_b*_i _b=_b xor _a end if _a>999999 then return end end`,
    `do local _t={} for _i=1,math.random(8,25) do _t[_i]=(_i*7)%13 end if #_t>100 then return end end`,
    `do local _x=0 while _x<math.random(10,30) do _x=_x+1 if _x%5==0 then _x=_x+1 end end end`,
    `do local _s="" for _i=1,math.random(3,8) do _s=_s..string.char(math.random(65,90)) end if #_s>20 then return end end`,
    `do local _n=os.time()%1000 for _i=1,10 do _n=(_n*31+17)%10007 end if _n==0 then return end end`,
    `do local _f=function(a,b)return a~=b end local _r=false for _i=1,math.random(5,15) do _r=_f(_i,_i+1) end if _r then return end end`,
    `do local _p={1,2,3,4,5} local _q=0 for _,_v in ipairs(_p) do _q=_q+_v*_v end if _q>1000 then return end end`,
  ];
  return templates[Math.floor(rng()*templates.length)];
}

function injectDeadCode(tokens, rng){
  const result = [];
  const deadBlocks = [];
  let depth = 0;
  for(let i=0;i<tokens.length;i++){
    const t = tokens[i];
    if(t.type==='keyword' && (t.value==='function'||t.value==='if'||t.value==='for'||t.value==='while'||t.value==='do')) depth++;
    if(t.type==='keyword' && t.value==='end') depth = Math.max(0, depth-1);
    result.push(t);
    // Inject dead blocks at safe points (after statements, depth > 0)
    if(depth > 0 && t.type==='op' && (t.value===';'||t.value===',')){
      if(rng() < 0.4){
        deadBlocks.push({index: result.length, code: generateDeadBlock(rng)});
      }
    }
  }
  // Insert dead blocks from the end so indices stay valid
  for(let i=deadBlocks.length-1;i>=0;i--){
    const db = deadBlocks[i];
    result.splice(db.index, 0, {type:'raw', value: db.code + ' '});
  }
  return result;
}

/* ============ MAIN OBFUSCATION ============ */
function obfuscateLua(src, opts){
  opts = opts || {};
  const seed = opts.seed || Date.now();
  let _s = seed;
  const rng = function(){ _s = (_s * 1103515245 + 12345) & 0x7fffffff; return _s / 0x7fffffff; };

  let tokens = tokenize(src).filter(t => t.type!=='ws' && t.type!=='comment');
  const locals = collectLocals(tokens);
  const usedNames = new Set();
  for(const t of tokens) if(t.type==='name') usedNames.add(t.value);
  function freshName(){ let n; do{ n='_'+Math.random().toString(36).slice(2,8); } while(usedNames.has(n)||KEYWORDS.has(n)); usedNames.add(n); return n; }

  const bxName = freshName();
  const dName = freshName();
  const tamperFlag = freshName();
  const debugHook = freshName();
  const lineCheck = freshName();

  const renameMap = new Map();
  for(const name of locals){
    if(GLOBALS.has(name)) continue;
    if(name===bxName||name===dName||name===tamperFlag) continue;
    renameMap.set(name, freshName());
  }

  let braceDepth = 0;
  const out = [];
  for(let i=0;i<tokens.length;i++){
    const t = tokens[i];
    if(t.type==='op'){ if(t.value==='{') braceDepth++; else if(t.value==='}') braceDepth--; out.push(t); continue; }
    if(t.type==='string'){ out.push({type:'raw', value: encodeString(parseLuaString(t.value), dName)}); continue; }
    if(t.type==='number'){ out.push({type:'raw', value: encodeNumber(t.value), numeric:true}); continue; }
    if(t.type==='name'){
      const prev = out.length ? out[out.length-1] : null;
      if(prev && prev.type==='op' && (prev.value==='.'||prev.value===':'||prev.value==='::')){ out.push(t); continue; }
      if(prev && prev.type==='keyword' && prev.value==='goto'){ out.push(t); continue; }
      const nx0 = tokens[i+1];
      if(nx0 && nx0.type==='op' && nx0.value==='::'){ out.push(t); continue; }
      if(braceDepth>0 && nx0 && nx0.type==='op' && nx0.value==='='){ out.push(t); continue; }
      if(renameMap.has(t.value)) out.push({type:'raw', value: renameMap.get(t.value)});
      else out.push(t);
      continue;
    }
    out.push(t);
  }

  // Inject dead code if enabled
  let finalTokens = out;
  if(opts.deadCode !== false){
    finalTokens = injectDeadCode(out, rng);
  }

  const body = generate(finalTokens);
  const antiTamper = opts.antiTamper !== false ? buildAntiTamper(tamperFlag, debugHook, lineCheck) : '';
  const header = buildHeader(bxName, dName);
  return header + antiTamper + body;
}

function generate(tokens){
  let out = '', prev = null;
  for(const t of tokens){
    if(prev && needsSpace(prev, t)) out += ' ';
    out += t.value; prev = t;
  }
  return out;
}

function needsSpace(a, b){
  const aLast = a.value[a.value.length-1], bFirst = b.value[0];
  const aWord = /[A-Za-z0-9_]/.test(aLast), bWord = /[A-Za-z0-9_]/.test(bFirst);
  if(aWord && bWord) return true;
  if(a.value==='-' && bFirst==='-') return true;
  if(a.value.endsWith('..') && b.numeric) return true;
  if(a.numeric && b.value.startsWith('..')) return true;
  if(a.value==='[' && (bFirst==='['||bFirst==='=')) return true;
  return false;
}

/* ---- UI ---- */
const input = document.getElementById('input'), output = document.getElementById('output');
const obfBtn = document.getElementById('obfBtn'), copyBtn = document.getElementById('copyBtn'), clearBtn = document.getElementById('clearBtn');
const inCount = document.getElementById('inCount'), outCount = document.getElementById('outCount');
function bytesLabel(s){ const b = new Blob([s]).size; if(b<1024) return b+' B'; return (b/1024).toFixed(2)+' KB'; }
input.addEventListener('input', ()=>{ inCount.textContent = bytesLabel(input.value); });

obfBtn.addEventListener('click', ()=>{
  const src = input.value;
  if(!src.trim()){ output.classList.add('error'); output.textContent = 'Please paste some Lua code first.'; return; }
  obfBtn.disabled = true; obfBtn.innerHTML = '<span class="spinner"></span>Working…';
  output.classList.remove('error');
  setTimeout(()=>{
    try{
      const result = obfuscateLua(src, { antiTamper:true, deadCode:true });
      output.textContent = result;
      outCount.textContent = bytesLabel(result);
      copyBtn.disabled = false;
      output.classList.remove('flash'); void output.offsetWidth; output.classList.add('flash');
    } catch(e){
      output.classList.add('error');
      output.textContent = 'Error: ' + e.message;
      outCount.textContent = '—'; copyBtn.disabled = true;
    } finally {
      obfBtn.disabled = false; obfBtn.textContent = 'Obfuscate';
    }
  }, 20);
});

copyBtn.addEventListener('click', async()=>{
  try{ await navigator.clipboard.writeText(output.textContent); copyBtn.textContent = 'Copied ✓'; setTimeout(()=>{ copyBtn.textContent = 'Copy Output'; }, 1400); }
  catch{ copyBtn.textContent = 'Copy failed'; setTimeout(()=>{ copyBtn.textContent = 'Copy Output'; }, 1400); }
});

clearBtn.addEventListener('click', ()=>{
  input.value = ''; inCount.textContent = '0 B';
  output.innerHTML = '<span class="placeholder">Obfuscated code will appear here…</span>';
  outCount.textContent = '0 B'; copyBtn.disabled = true; output.classList.remove('error');
});
</script>
</body>
</html>
